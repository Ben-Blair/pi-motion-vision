############################################################
# Motion 4.7.x – Global Configuration
############################################################

# Required for systemd
daemon off
setup_mode off

############################################################
# Logging
############################################################
log_level 6

############################################################
# Motion Detection Defaults
############################################################
threshold 1500
minimum_motion_frames 3
emulate_motion off

############################################################
# Recording Defaults
############################################################
movie_output on
movie_codec mp4
movie_max_time 600

############################################################
# Event Timing
############################################################
event_gap 10
pre_capture 1
post_capture 1

############################################################
# Hooks (Safety)
############################################################
on_picture_save /usr/local/bin/on_picture_save_score.sh %f

############################################################
# Camera 0
############################################################
camera /etc/motion/camera0.conf
