############################################################
# Camera 0 – Motion 4.7.0
############################################################

############################################################
# Live stream (MJPEG in browser)
############################################################
stream_port 8080
stream_localhost off
stream_preview_method 4
stream_maxrate 15
stream_quality 50

############################################################
# Camera Settings
############################################################

video_device /dev/video0
width 1280
height 720
framerate 15

############################################################
# Motion Detection
############################################################
threshold 2500
minimum_motion_frames 3
emulate_motion off

############################################################
# Video Recording (SD Card)
############################################################
movie_output on
movie_codec mp4
target_dir /var/lib/motion
movie_filename videos/%Y%m%d-%H%M%S

############################################################
# Snapshots (RAM via bind mount)
############################################################
picture_output on
picture_type jpeg
picture_output_motion off
picture_filename snapshots/%Y%m%d-%H%M%S-%q

############################################################
# Hooks
############################################################
on_event_start /usr/local/bin/on_event_start.sh
on_movie_end /usr/local/bin/on_movie_end.sh %f
on_event_end /usr/local/bin/on_event_end_pipeline.sh

