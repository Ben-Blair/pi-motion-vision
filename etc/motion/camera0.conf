############################################################
# Camera 0 – Motion 4.7.0
############################################################

# --- enable live stream ---
# stream_port 8081
#
# allow viewing from other machines (keep enabled if you only want localhost access)
# stream_localhost off


video_device /dev/video0
width 1280
height 720
framerate 15

############################################################
# Motion Detection
############################################################
threshold 1500
minimum_motion_frames 3
emulate_motion off

############################################################
# Video Recording (SD Card)
############################################################
movie_output on
movie_codec mp4
target_dir /var/lib/motion
movie_filename %Y%m%d-%H%M%S

############################################################
# Snapshots (RAM via bind mount)
############################################################
picture_output on
picture_type jpeg
picture_output_motion off
picture_filename snapshots/%Y%m%d-%H%M%S-%q

############################################################
# Hooks
############################################################
on_event_start /usr/local/bin/on_event_start.sh
on_event_end /usr/local/bin/on_event_end_pipeline.sh

