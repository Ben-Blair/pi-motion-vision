[Service]
WorkingDirectory=/var/lib/motion

# Ensure Motion loads the intended config and avoids relative-path writes to '/'
ExecStart=
ExecStart=/usr/bin/motion -c /etc/motion/motion.conf

# Enable annotated debug scoring frame output from select_best_snapshot.py
# (consumed by /usr/local/bin/on_event_end_pipeline.sh)
# Disabled for performance - re-enable if needed for debugging
# To re-enable: change MOTION_DEBUG_SCORING=0 to MOTION_DEBUG_SCORING=1
Environment=MOTION_DEBUG_SCORING=0
Environment=EMAIL_MODE=user

# Supabase: run scripts/upload_new_motion_videos.py from on_movie_end after each MP4
Environment=SUPABASE_UPLOAD=1
Environment=PI_MOTION_VISION_REPO=/home/bblair23/pi-motion-vision
